# Prod container limit is 256M: the watermark must sit below it, or the kernel
# OOM-kills the broker before RabbitMQ's own flow control ever starts.
vm_memory_high_watermark.absolute = 160MB
disk_free_limit.absolute = 500MB
heartbeat = 120
classic_queue.default_version = 2
load_definitions = /etc/rabbitmq/definitions.json
