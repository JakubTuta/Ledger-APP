# Shared alembic config for every database this service owns.
#
# script_location and sqlalchemy.url are set per database at runtime by
# migration_service/runner.py - one ini serves both script directories.
# Logging is configured by migration_service/main.py, so this file
# deliberately carries no [loggers]/[handlers] sections.

[alembic]
script_location =
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
